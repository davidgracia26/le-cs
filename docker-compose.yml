services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - data:/data
  demo:
    profiles: ["demo"]
    image: curlimages/curl
    depends_on:
      - api
    volumes:
      - ./demo:/demo:ro
    entrypoint: ["sh", "/demo/demo.sh"]
  tests:
    profiles: ["tests"]
    build:
      context: .
      target: tests
    pull_policy: build

volumes:
  data:
